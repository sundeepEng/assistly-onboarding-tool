name: API Contract Tests

on:
  workflow_dispatch:
    inputs:
      dynamo_base_url:
        description: 'Base URL of the legacy DynamoDB API (us-east-1)'
        required: true
        type: string
      rds_base_url:
        description: 'Base URL of the new RDS API (us-east-2)'
        required: true
        type: string
      api_token:
        description: 'Cognito access token'
        required: true
        type: string
      test_user_id:
        description: 'Optional user id for /v1/user and /v1/clinical/user'
        required: false
        type: string
      test_home_id:
        description: 'Optional home id for /v1/home/{id}'
        required: false
        type: string

jobs:
  contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run contract tests
        env:
          DYNAMO_BASE_URL: ${{ inputs.dynamo_base_url }}
          RDS_BASE_URL: ${{ inputs.rds_base_url }}
          API_TOKEN: ${{ inputs.api_token }}
          TEST_USER_ID: ${{ inputs.test_user_id }}
          TEST_HOME_ID: ${{ inputs.test_home_id }}
        run: npx jest test/api-contract/contract.test.ts --runInBand
