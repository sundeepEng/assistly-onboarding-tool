name: Manual Reset RDS

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Target AWS region'
        required: true
        default: 'us-east-2'
        type: string
      customBranch:
        description: 'Branch that contains the reset scripts (e.g. feature/rds-migration). Defaults to the current migration feature branch.'
        required: true
        default: 'feature/rds-migration'
        type: choice
        options:
          - feature/rds-migration
          - main
          - dev
          - stg
      target_stage:
        description: 'Stage database to reset'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - stg
          - main
      danger_confirmation:
        description: 'Type RESET-MAIN to allow reset of main or all stages'
        required: false
        type: string

env:
  TARGET_REGION: ${{ inputs.region || 'us-east-2' }}

jobs:
  setup:
    name: Determine target stages
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.set-stages.outputs.stages }}
    steps:
      - name: Confirm destructive operation on main
        if: inputs.target_stage == 'main' || inputs.target_stage == 'all'
        run: |
          if [ "${{ inputs.danger_confirmation }}" != "RESET-MAIN" ]; then
            echo "To reset main or all stages, enter danger_confirmation 'RESET-MAIN'" >&2
            exit 1
          fi

      - name: Set target stages
        id: set-stages
        run: |
          if [ "${{ inputs.target_stage }}" == "all" ]; then
            echo 'stages=["dev","stg","main"]' >> $GITHUB_OUTPUT
          else
            echo 'stages=["${{ inputs.target_stage }}"]' >> $GITHUB_OUTPUT
          fi

  reset-rds:
    name: Reset RDS for ${{ matrix.stage }} in ${{ inputs.region || 'us-east-2' }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      max-parallel: 1
      matrix:
        stage: ${{ fromJSON(needs.setup.outputs.stages) }}
    env:
      STAGE: ${{ matrix.stage }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.customBranch || github.ref_name }}

      - name: Verify reset script exists on selected branch
        run: |
          if [ ! -f "scripts/reset-rds.ts" ]; then
            echo "Reset script not found on branch ${{ inputs.customBranch || github.ref_name }}" >&2
            echo "Make sure the selected branch contains scripts/reset-rds.ts." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install ts-node
        run: npm install -g ts-node typescript

      - name: Install jq and SSM Session Manager plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o session-manager-plugin.deb
          sudo dpkg -i session-manager-plugin.deb

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TARGET_REGION }}

      - name: Resolve migration bastion instance ID
        run: |
          STACK_NAME="assistly-${{ env.STAGE }}-${{ env.TARGET_REGION }}"
          BASTION_INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='MigrationBastionInstanceId'].OutputValue" \
            --output text)

          if [ -z "$BASTION_INSTANCE_ID" ] || [ "$BASTION_INSTANCE_ID" = "None" ]; then
            echo "Could not resolve MigrationBastionInstanceId from stack $STACK_NAME" >&2
            exit 1
          fi

          echo "BASTION_INSTANCE_ID=$BASTION_INSTANCE_ID" >> $GITHUB_ENV

      - name: Load DB credentials from Secrets Manager
        run: |
          set +x
          SECRET=$(aws secretsmanager get-secret-value --secret-id PostgresCredentials-${{ env.STAGE }}-${{ env.TARGET_REGION }} --query SecretString --output text)
          DB_HOST=$(echo $SECRET | jq -r .host)
          DB_USER=$(echo $SECRET | jq -r .username)
          DB_PASS=$(echo $SECRET | jq -r .password)
          DB_NAME=$(echo $SECRET | jq -r .dbname)
          DB_PORT=$(echo $SECRET | jq -r .port)

          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$DB_NAME"
          echo "::add-mask::$DB_PORT"

          echo "DB_USER=$DB_USER" >> $GITHUB_ENV
          echo "DB_PASS=$DB_PASS" >> $GITHUB_ENV
          echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV

      - name: Wait for RDS Proxy to be available
        run: |
          DB_PROXY_NAME="assistly-rds-proxy-${{ env.STAGE }}"
          MAX_RETRIES=60
          SLEEP=5

          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(aws rds describe-db-proxies \
              --db-proxy-name "$DB_PROXY_NAME" \
              --query 'DBProxies[0].Status' \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "available" ]; then
              TARGETS=$(aws rds describe-db-proxy-targets \
                --db-proxy-name "$DB_PROXY_NAME" \
                --target-group-name default \
                --query 'Targets[*].[RdsResourceId,Type,TargetHealth.State,TargetHealth.Reason]' \
                --output text 2>/dev/null || true)

              if echo "$TARGETS" | grep -q "AVAILABLE"; then
                echo "RDS Proxy $DB_PROXY_NAME is available and target is healthy"
                exit 0
              fi
              echo "Proxy available, waiting for target: ${TARGETS:-none}"
            else
              echo "Waiting for RDS Proxy (status: ${STATUS:-unknown})..."
            fi

            sleep $SLEEP
          done

          echo "RDS Proxy $DB_PROXY_NAME or its target did not become available within 5 minutes" >&2
          exit 1

      - name: Resolve RDS Proxy endpoint
        run: |
          DB_PROXY_NAME="assistly-rds-proxy-${{ env.STAGE }}"
          DB_HOST=$(aws rds describe-db-proxies \
            --db-proxy-name "$DB_PROXY_NAME" \
            --query 'DBProxies[0].Endpoint' \
            --output text)

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "Could not resolve RDS Proxy endpoint for $DB_PROXY_NAME" >&2
            exit 1
          fi

          echo "RDS Proxy endpoint: $DB_HOST"
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV

      - name: Open SSM tunnel to RDS via the region's bastion
        run: |
          DB_PROXY_IP=$(python3 -c "import socket; print(socket.getaddrinfo('${DB_HOST}', None, socket.AF_INET)[0][4][0])")
          if [ -z "$DB_PROXY_IP" ]; then
            echo "Could not resolve proxy endpoint $DB_HOST" >&2
            exit 1
          fi
          echo "Resolved $DB_HOST to $DB_PROXY_IP"

          setsid aws ssm start-session \
            --target "$BASTION_INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"$DB_PROXY_IP\"],\"portNumber\":[\"5432\"],\"localPortNumber\":[\"5432\"]}" > /tmp/ssm-tunnel.log 2>&1 &

          for i in {1..30}; do
            if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
            echo "SSM tunnel failed to open local port 5432" >&2
            cat /tmp/ssm-tunnel.log >&2
            exit 1
          fi

      - name: Reset RDS schema
        run: DB_HOST=127.0.0.1 ts-node scripts/reset-rds.ts

      - name: Print SSM tunnel log on reset failure
        if: failure()
        run: |
          echo "--- SSM tunnel log ---" >&2
          cat /tmp/ssm-tunnel.log >&2 || true
